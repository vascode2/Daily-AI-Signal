er on our agentic knowledge work benchmark, AA-Briefcase, outperforming Claude Fable 5 by nearly 150 Elo while reducing Cost per Task by 20%\"}]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Anthropic has released Claude Opus 5, the new leader on the Artificial Analysis Intelligence Index, and also the #1 model on our proprietary agentic knowledge work benchmark, AA-Briefcase. At max effort, Claude Opus 5 scores an AA-Briefcase Elo of 1720, 146 points ahead of Claude Fable 5 (1574). Its xhigh (1693) and high (1606) variants also outperform Fable 5 while being more cost efficient\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"We benchmarked all five effort settings ahead of release. Claude Opus 5 (max) costs $17.79 per task, a 20% reduction from Claude Fable 5 ($22.30). The xhigh and high variants offer stronger cost-efficiency tradeoffs, both scoring above Fable 5 while costing 64% ($14.26) and 47% ($10.41) as much respectively\"}],\"\\n\",[\"$\",\"p\",\"p-3\",{\"children\":\"AA-Briefcase is our proprietary benchmark for agentic knowledge work, evaluating models on realistic, private tasks spanning thousands of input files and requiring deliverables such as research reports, presentations, and spreadsheets. Performance is measured across correctness, analytical quality, and presentation quality, and combined into a single metric, the AA-Briefcase Elo\"}],\"\\n\",[\"$\",\"p\",\"p-4\",{\"children\":[\"$\",\"$1\",\"img-0\",{\"children\":[[\"$\",\"img\",null,{\"node\":{\"type\":\"element\",\"tagName\":\"img\",\"properties\":{\"src\":\"https://cdn.sanity.io/images/6vfeftx9/articles/89eb4189714f0488ee896276827ae84d052b60d7-4640x4160.png\",\"alt\":\"\"},\"children\":[],\"position\":{\"start\":{\"line\":11,\"column\":1,\"offset\":1323},\"end\":{\"line\":11,\"column\":107,\"offset\":1429}}},\"src\":\"https://cdn.sanity.io/images/6vfeftx9/articles/89eb4189714f0488ee896276827ae84d052b60d7-4640x4160.png?w=1200\u0026auto=format\",\"srcSet\":\"https://cdn.sanity.io/images/6vfe
